<style>
/* Layout: airy, near-white workspace; Today opens on one big number and a dotted progress ring, then soft frosted cards. Ink black, soft greys, two pastel blurs. */
:root{
  --bg:#f3f3f1; --side:#f7f7f5; --card:#ffffff; --fg:#151515; --muted:#8b8b87; --line:#ebebe8; --line2:#dfdfdb;
  --primary:#171717; --primary-h:#000000; --on-primary:#ffffff;
  --green:#f0f0ed; --green2:#e8e8e4; --amber:#f4ede0; --amber-fg:#7a5a1c; --red-bg:#f7e5e1; --red:#a23b2a; --ok:#4d6a49; --avatar:#e6e6e2; --gift:#f2e7eb; --gift-fg:#7a4659;
  --cv-a:#efdcdc; --cv-b:#dde6d6; --cv-c:#f4f4f2; --cv-d:#e9e9e6;
  --glass:rgba(255,255,255,.55); --glass-line:rgba(255,255,255,.85); --panel:rgba(255,255,255,.78); --blob-a:#f2c9cf; --blob-b:#c9dcbc; --blob-c:#ece3cf; --dot:#c9c9c4;
  --shadow:0 20px 50px rgba(20,20,20,.10);
  --f-body:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-head:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --f-display:"Instrument Serif","Iowan Old Style","Palatino Linotype",Georgia,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme]){
  --bg:#111111; --side:#151515; --card:#1b1b1b; --fg:#f2f2f0; --muted:#9a9a96; --line:#262626; --line2:#323232;
  --primary:#f2f2f0; --primary-h:#ffffff; --on-primary:#111111;
  --green:#202020; --green2:#2a2a2a; --amber:#3a3020; --amber-fg:#e9c27e; --red-bg:#3c2320; --red:#f0a090; --ok:#a9c79f; --avatar:#2e2e2e; --gift:#37262d; --gift-fg:#e7b3c2;
  --cv-a:#3a2a2a; --cv-b:#26302a; --cv-c:#1b1b1b; --cv-d:#222222;
  --glass:rgba(30,30,30,.55); --glass-line:rgba(255,255,255,.07); --panel:rgba(27,27,27,.82); --blob-a:#4a2a30; --blob-b:#2c3d28; --blob-c:#3a3326; --dot:#3a3a3a;
  --shadow:0 20px 50px rgba(0,0,0,.5); color-scheme:dark }}
:root[data-theme="dark"],:root[data-theme="night"]{
  --bg:#111111; --side:#151515; --card:#1b1b1b; --fg:#f2f2f0; --muted:#9a9a96; --line:#262626; --line2:#323232;
  --primary:#f2f2f0; --primary-h:#ffffff; --on-primary:#111111;
  --green:#202020; --green2:#2a2a2a; --amber:#3a3020; --amber-fg:#e9c27e; --red-bg:#3c2320; --red:#f0a090; --ok:#a9c79f; --avatar:#2e2e2e; --gift:#37262d; --gift-fg:#e7b3c2;
  --cv-a:#3a2a2a; --cv-b:#26302a; --cv-c:#1b1b1b; --cv-d:#222222;
  --glass:rgba(30,30,30,.55); --glass-line:rgba(255,255,255,.07); --panel:rgba(27,27,27,.82); --blob-a:#4a2a30; --blob-b:#2c3d28; --blob-c:#3a3326; --dot:#3a3a3a;
  --shadow:0 20px 50px rgba(0,0,0,.5); color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;letter-spacing:-.003em}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--f-head);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font:400 40px/1.05 var(--f-display);letter-spacing:-.01em;color:var(--fg)}
h2{font-size:17px;font-weight:600;letter-spacing:-.01em}
h3{font-size:15px;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:13px;font-weight:500;color:var(--muted)}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);height:100%}
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:20px;padding:22px 14px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.mark{width:34px;height:34px;border-radius:50%;background:var(--avatar);color:var(--fg);display:grid;place-items:center;font:400 18px var(--f-display);overflow:hidden;flex:none}
.mark img{width:100%;height:100%;object-fit:cover}
.brand b{font:400 21px/1.1 var(--f-display);display:block}
.brand span{font-size:12.5px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;padding:9px 12px;border-radius:999px;cursor:pointer;font-weight:500;text-align:left;color:var(--fg)}
.nav button:hover{background:var(--green)}
.nav button[aria-current="page"]{background:var(--card);font-weight:600;box-shadow:0 1px 3px rgba(20,20,20,.06)}
.nav .count{margin-left:auto;font-size:12px;font-weight:600;background:var(--amber);color:var(--amber-fg);border-radius:20px;padding:1px 8px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:12px 10px;border-top:1px solid var(--line);font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--muted);flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--amber-fg)} .dot.bad{background:var(--red)}
.status-line{display:flex;align-items:center;gap:8px}
.bell{position:relative;border:1px solid var(--line2);background:var(--card);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;color:var(--fg);flex:none}
.bell:hover{border-color:var(--primary)}
.bell-n{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--red);color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center;border:2px solid var(--side)}
.sched-chips{display:flex;gap:8px;flex-wrap:wrap}
.schip{border:1px solid var(--line2);background:var(--card);border-radius:20px;padding:6px 14px;cursor:pointer;font-size:14px;color:var(--fg)}
.schip b{font-family:var(--f-head);font-size:16px;margin-right:2px}
.schip.red{border-color:var(--red);color:var(--red);background:var(--red-bg)}
.schip:hover{border-color:var(--primary)}
.subhead{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;padding:12px 18px 4px;font:700 13px var(--f-head);text-transform:uppercase;letter-spacing:.05em;border-top:1px solid var(--line)}
.subhead:first-child{border-top:0}
.subhead .muted{font:400 13px var(--f-body);text-transform:none;letter-spacing:0}
.pill.work{background:var(--green2);color:var(--fg)}
.pill.routine{background:var(--green);color:var(--primary)}
.pill.routine .ico{width:13px;height:13px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line)}
.day{background:var(--card);min-height:150px;padding:8px;display:flex;flex-direction:column;gap:5px;min-width:0}
.day.today{background:var(--green)}
.day.past{opacity:.6}
.day-head{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700;color:var(--muted)}
.day.today .day-head span{color:var(--primary)}
.day-head .iconbtn{padding:3px}
.ev{display:flex;flex-direction:column;gap:1px;text-align:left;border:0;border-radius:7px;padding:5px 7px;font-size:12.5px;line-height:1.3;cursor:pointer;color:var(--fg);overflow-wrap:anywhere;width:100%}
.ev .ev-k{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;opacity:.8}
.ev.due{background:var(--amber);color:var(--amber-fg)}
.ev.work{background:var(--green2);border-left:3px solid var(--primary)}
.ev.late{background:var(--red-bg);color:var(--red)}
.ev.routine{background:none;border:1px dashed var(--primary);color:var(--primary);flex-direction:row;align-items:center;gap:5px}
.ev.routine .ico{width:13px;height:13px}
.ev.routine.is-done{text-decoration:line-through;opacity:.6}
.free{font-size:12px;color:var(--muted);margin-top:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:10px 18px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg{width:12px;height:12px;border-radius:3px;display:inline-block}
.lg.due{background:var(--amber)} .lg.work{background:var(--green2);border-left:3px solid var(--primary)} .lg.routine{border:1px dashed var(--primary)} .lg.late{background:var(--red-bg)}
.daypick{display:flex;gap:6px;flex-wrap:wrap}
.dp{border:1px solid var(--line2);background:var(--card);border-radius:9px;padding:7px 10px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--fg);min-width:48px}
.dp.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
@media (max-width:900px){.week{grid-template-columns:minmax(0,1fr)}.day{min-height:0;flex-direction:column}.day.past{display:none}.free{margin-top:0}}
.cover{position:relative;margin-top:-28px;margin-inline:-32px}
.cover-img{height:230px;background:radial-gradient(120% 140% at 0% 0%,var(--cv-a) 0%,transparent 55%),radial-gradient(90% 120% at 100% 100%,var(--cv-b) 0%,transparent 60%),linear-gradient(135deg,var(--cv-c),var(--cv-d));background-size:cover;background-position:center 50%;position:relative}
.cover-img.dark-def{background:linear-gradient(135deg,#2a2520,#3a322a)}
.cover-actions{position:absolute;right:16px;bottom:14px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;opacity:.0;transition:opacity .15s}
.cover:hover .cover-actions,.cover:focus-within .cover-actions,.cover-actions.show{opacity:1}
.glass{background:rgba(251,249,245,.86);border-color:transparent;color:#2a2622;backdrop-filter:blur(6px)}
.glass:hover{background:#fbf9f5;border-color:transparent}
.cover-id{display:flex;align-items:flex-end;gap:18px;padding:0 32px;margin-top:-52px;position:relative;flex-wrap:wrap}
.me{width:104px;height:104px;border-radius:50%;border:4px solid var(--bg);background:var(--avatar);display:grid;place-items:center;font:400 40px var(--f-display);overflow:hidden;flex:none;cursor:pointer;padding:0;color:var(--fg)}
.me img{width:100%;height:100%;object-fit:cover}
.cover-id .who{padding-bottom:6px;min-width:0}
.cover-id .who p{color:var(--muted);margin-top:4px}
.pos{position:absolute;left:16px;bottom:14px;display:flex;align-items:center;gap:8px;background:rgba(251,249,245,.9);border-radius:9px;padding:6px 10px;font-size:13px;color:#2a2622}
@media (hover:none){.cover-actions{opacity:1}}
@media (max-width:760px){.cover{margin-top:-20px;margin-inline:-16px}.cover-img{height:160px}.cover-id{padding:0 16px;margin-top:-44px}.me{width:84px;height:84px;font-size:32px}}
.main{position:relative;isolation:isolate}
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px 40px;align-items:center}
.hero-top{grid-column:1/-1;display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.hero-top h1{font-size:46px}
.hero-top p{color:var(--muted);margin-top:6px}
.hero-me{width:52px;height:52px;border-radius:50%;background:var(--avatar);display:grid;place-items:center;overflow:hidden;border:0;padding:0;cursor:pointer;font:400 22px var(--f-display);color:var(--fg);flex:none}
.hero-me img{width:100%;height:100%;object-fit:cover}
.ring{width:220px;height:220px;display:block}
.big{font:300 76px/1 var(--f-body);letter-spacing:-.04em}
.big-sub{color:var(--muted);margin-top:8px;font-size:14px}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:22px}
.mini button{border:1px solid var(--glass-line);background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:18px;padding:14px 16px;text-align:left;cursor:pointer;color:var(--fg);font:inherit;min-width:0}
.mini button:hover{border-color:var(--primary)}
.mini .k{font-size:13px;color:var(--muted)}
.mini .v{font-size:17px;font-weight:500;margin-top:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.glass-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.glass-card{position:relative;background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:26px;padding:20px 20px 22px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;gap:16px;cursor:pointer;text-align:left;color:var(--fg);font:inherit;box-shadow:0 1px 0 rgba(255,255,255,.4) inset}
.glass-card:hover{border-color:var(--line2)}
.glass-card h3{font:400 24px/1.1 var(--f-body);letter-spacing:-.02em;max-width:9ch}
.glass-card p{font-size:13px;color:var(--muted);max-width:28ch}
.glass-card .plus{position:absolute;right:16px;bottom:16px;width:44px;height:44px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:0 4px 14px rgba(20,20,20,.08)}
@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr);gap:18px}.hero-top h1{font-size:40px}.ring{width:200px;height:200px;margin:4px auto}.big{font-size:64px}.mini{grid-template-columns:repeat(2,minmax(0,1fr))}.mini button:last-child{grid-column:1/-1}.glass-row{grid-template-columns:minmax(0,1fr)}.glass-card{min-height:132px}}
/* day view and cards, inspired by a calm booking-app look */
.dayv{display:flex;flex-direction:column;gap:14px}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dhead h2{font:400 34px/1.05 var(--f-display);letter-spacing:-.01em}
.mpill{display:inline-flex;align-items:center;gap:2px;background:var(--card);border-radius:999px;padding:4px;box-shadow:0 1px 0 var(--line)}
.mpill span{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;padding:0 4px;white-space:nowrap}.mpill .ico{width:15px;height:15px}
.mpill button{border:0;background:none;width:28px;height:28px;border-radius:50%;font-size:18px;line-height:1;cursor:pointer;color:var(--fg)}
.mpill button:hover{background:var(--green)}
.roundadd{width:44px;height:44px;border-radius:50%;border:0;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;cursor:pointer;flex:none}.roundadd .ico{width:20px;height:20px}
.dstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dpill{border:0;background:var(--card);border-radius:22px;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;color:var(--fg);font:inherit;min-width:0}
.dpill .dw{font-size:12px;color:var(--muted)}.dpill b{font-size:19px;font-weight:600;line-height:1.25}.dpill .dn{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dpill.is-today:not(.on) b{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}
.dpill.on{background:var(--primary);color:var(--on-primary)}.dpill.on .dw{color:rgba(255,255,255,.7)}.dpill.on .dn{color:#e9d97a}
:root[data-theme="night"] .dpill.on .dw{color:rgba(0,0,0,.6)}:root[data-theme="night"] .dpill.on .dn{color:#7a6512}
.tline{display:flex;flex-direction:column;gap:10px}
.trow{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:start}
.tcol{padding-top:12px;display:flex;flex-direction:column;line-height:1.15}.tcol b{font-size:15px;font-weight:600}.tcol span{font-size:11.5px;color:var(--muted)}
.tcard{background:var(--card);border-radius:22px;padding:12px 12px 10px;display:flex;flex-direction:column;gap:9px;cursor:pointer;text-align:left;box-shadow:0 1px 0 var(--line)}
.tcard:hover{box-shadow:0 6px 18px rgba(20,20,20,.07)}
.tcard.is-done .tt{text-decoration:line-through;color:var(--muted)}
.tcard-top{display:flex;gap:10px;align-items:center}
.tico{width:36px;height:36px;border-radius:50%;background:var(--green);display:grid;place-items:center;flex:none}.tico .ico{width:17px;height:17px}
.tt{font-weight:600;font-size:15px;line-height:1.25}.ts{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcheck{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line2);background:none;display:grid;place-items:center;cursor:pointer;flex:none;color:var(--on-primary);padding:0}
.tcheck.on{background:var(--primary);border-color:var(--primary)}.tcheck .ico{width:15px;height:15px}
.tcard-foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tmeta{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tav{width:22px;height:22px;border-radius:50%;background:var(--avatar);display:grid;place-items:center;font-size:9.5px;font-weight:700;color:var(--fg);flex:none}
.spill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--green2);color:var(--fg);white-space:nowrap}
.spill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--muted)}
.spill.due::before{background:#7fae74}.spill.work::before{background:#c9a35b}.spill.routine::before{background:#a993d6}
.spill.late{background:#d9896b;color:#fff}.spill.late::before{display:none}
.spill.done{background:var(--primary);color:var(--on-primary)}.spill.done::before{display:none}
.tslot{border:1.5px dashed var(--line2);background:none;border-radius:22px;padding:14px;display:flex;align-items:center;gap:8px;color:var(--muted);font:500 14px var(--f-body);cursor:pointer;text-align:left}
.tslot .ico{width:16px;height:16px}
.ncards{display:flex;flex-direction:column;gap:10px}
.ncards .tcard{box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line)}
.nset{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:20px;background:var(--green)}
.nset .grow p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
:root[data-theme="ivory"]{--bg:#f3efe8;--side:#f6f2ec;--card:#fbf9f5;--fg:#2e2823;--muted:#988c80;--line:#e9e2d7;--line2:#ddd3c5;
  --primary:#6b5d52;--primary-h:#5a4e44;--on-primary:#fbf9f5;--green:#efe9df;--green2:#e8e0d3;--avatar:#e8dfd2;--amber:#f2e6d2;--amber-fg:#7d5f2c;--gift:#efe3df;--gift-fg:#7a5048;

function icon(n){const s=document.createElement('span');s.className='ico';s.setAttribute('aria-hidden','true');s.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+(ICONS[n]||'')+'</svg>';return s}

/* ---------- tiny DOM helper ---------- */
function h(tag,attrs,...kids){
  const el=document.createElement(tag);let val;
  if(attrs)for(const[k,v]of Object.entries(attrs)){
    if(v==null||v===false)continue;
    if(k.startsWith('on')&&typeof v==='function')el.addEventListener(k.slice(2),v);
    else if(k==='class')el.className=v;
    else if(k==='value')val=v;
    else if(k==='checked')el.checked=!!v;
    else el.setAttribute(k,v===true?'':v);
  }
  for(const k of kids.flat(Infinity)){if(k==null||k===false)continue;el.append(k.nodeType?k:document.createTextNode(String(k)))}
  if(val!==undefined)el.value=val;
  return el;
}
const $=s=>document.querySelector(s);

/* ---------- formatting ---------- */
const pad=n=>String(n).padStart(2,'0');
function ymd(d=new Date()){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseYmd(s){if(!s||!/^\d{4}-\d{2}-\d{2}$/.test(s))return null;const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function addDays(s,n){const d=parseYmd(s);if(!d)return '';d.setDate(d.getDate()+n);return ymd(d)}
function daysFrom(s){const d=parseYmd(s);if(!d)return null;const t=parseYmd(ymd());return Math.round((d-t)/864e5)}
function fmtDay(s){const d=parseYmd(s);if(!d)return '';const n=daysFrom(s);if(n===0)return 'Today';if(n===1)return 'Tomorrow';if(n===-1)return 'Yesterday';return d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:d.getFullYear()!==new Date().getFullYear()?'numeric':undefined})}
function fmtWhen(iso){if(!iso)return '';const d=new Date(iso);if(isNaN(d))return '';const now=new Date();if(d.toDateString()===now.toDateString())return d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});return d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:d.getFullYear()!==now.getFullYear()?'numeric':undefined})}
function fmtFull(ms){const d=new Date(ms);return isNaN(d)?'':d.toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'})}
function money(n,c){if(n==null||n===''||isNaN(Number(n)))return '';try{return new Intl.NumberFormat(undefined,{style:'currency',currency:c||defCur(),maximumFractionDigits:2}).format(Number(n))}catch{return Number(n).toLocaleString()+' '+(c||'')}}
function decode(s){const t=document.createElement('textarea');t.innerHTML=String(s||'');return t.value.replace(/[͏‌​­]/g,'').replace(/\s{2,}/g,' ').trim()}
function parseAddr(s){s=String(s||'').trim();const m=s.match(/^\s*"?([^"<]*?)"?\s*<([^>]+)>\s*$/);if(m)return{name:m[1].trim()||m[2],email:m[2].trim().toLowerCase()};return{name:s.split('@')[0]||s,email:s.toLowerCase()}}
function initials(n){const p=String(n||'?').replace(/[^\p{L}\p{N} ]/gu,' ').trim().split(/\s+/);return((p[0]||'?')[0]+((p[1]||'')[0]||'')).toUpperCase()}
function emails(s){return String(s||'').split(/[,;\s]+/).map(x=>x.trim()).filter(Boolean)}
const validEmail=e=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e);
const isNoReply=e=>/no-?reply|donotreply|notification|mailer-daemon|newsletter|news@|info@mail|@e\.|bounce/i.test(e);
function defCur(){return S.settings.currency||'EUR'}
function myName(){return S.settings.name||''}

/* ---------- state ---------- */
const S={routines:[],campaigns:[],tasks:[],invoices:[],contacts:[],sent:[],settings:{},ready:{},
  lists:{unread:{threads:[],loading:true,error:null,key:'',unsub:null,at:null},deals:{threads:[],loading:true,error:null,key:'',unsub:null,at:null},inbox:{threads:[],loading:true,error:null,key:'',unsub:null,at:null}},
  inboxTab:'deals',inboxQ:'',thread:{id:null,data:null,loading:false,error:null},
  gmailStatus:'checking',gmailPerm:null,dbStatus:'checking',aiOk:null,showDone:false,schedView:'day',dayPick:null,weekOffset:0};
const C={db:null,user:null,mcp:null,sample:null,perms:null,assets:null};
let base=null,settingsRef=null;
let page=(location.hash||'').replace('#','')||'today';
if(!['today','inbox','campaigns','schedule','payments','contacts','settings'].includes(page))page='today';

/* ---------- persistence ---------- */
function clean(o){return JSON.parse(JSON.stringify(o))}
async function save(coll,obj){
  const{id,...rest}=obj;rest.updatedAt=Date.now();if(!rest.createdAt)rest.createdAt=Date.now();
  if(base){const ref=id?base.collection(coll).doc(id):base.collection(coll).doc();await ref.set(clean(rest));return ref.id}
  const nid=id||('m'+Math.random().toString(36).slice(2,10));const rec={...clean(rest),id:nid};
  const i=S[coll].findIndex(x=>x.id===nid);if(i>=0)S[coll][i]=rec;else S[coll].push(rec);schedule();return nid;
}
async function removeDoc(coll,id){if(base){await base.collection(coll).doc(id).delete();return}S[coll]=S[coll].filter(x=>x.id!==id);schedule()}
async function saveSettings(patch){const next={...S.settings,...patch,updatedAt:Date.now()};if(settingsRef){await settingsRef.set(clean(next))}else{S.settings=next;schedule()}}
function dbErrCopy(e){switch(e?.code){case 'quota_exceeded':return 'Storage is full. Delete some old records, then try again.';case 'resource_exhausted':return 'Saving too fast. Wait a few seconds and try again.';case 'invalid_argument':return 'This couldn\'t be saved with your current access to the app.';case 'revoked':return 'Access to saved data was removed. Reload the page.';default:return 'Couldn\'t save just now. Check your connection and try again.'}}
async function attempt(fn,ok){try{const r=await fn();if(ok)toast(ok);return r}catch(e){console.error(e);toast(e&&e.code&&!e.gm?dbErrCopy(e):(e?.copy||dbErrCopy(e)));return undefined}}

/* ---------- gmail ---------- */
function gmErr(e){
  switch(e?.code){
    case 'needs_reauth':return 'Your Gmail connection has expired. Reconnect Gmail in claude.ai Settings → Connectors, then reload this page.';
    case 'server_not_connected':return 'Gmail isn\'t connected to your Claude account. Add the Gmail connector in claude.ai Settings → Connectors, then reload.';
    case 'selection_required':return 'You have more than one Gmail account connected. Choose one when Claude asks, then reload.';
    case 'not_in_manifest':return 'Gmail is turned off for this app. Turn it on in this page\'s Permissions menu (Settings → Manage permissions).';
    case 'approval_required':return 'Gmail needs your OK before this app can read your mail.';
    case 'blocked_by_policy':return 'Your organization blocks this Gmail action.';
    case 'server_unavailable':case 'rate_limited':return 'Gmail didn\'t answer just now. Try again in a moment.';
    case 'tool_error':return 'Gmail reported a problem: '+(e.message||'unknown error');
    case 'no_mcp':case 'not_granted':case 'capability_disabled':case 'capability_removed':return 'Gmail is only available when this app is open inside Claude.';
    default:return 'Gmail had a problem: '+(e?.message||'unknown error');
  }
}
async function allowGmail(){
  if(!C.perms){toast('Open this app inside Claude to connect Gmail.');return}
  let st;try{st=(await C.perms.request(['mcp:'+GM]))['mcp:'+GM]}catch{st=null}
  S.gmailPerm=st||S.gmailPerm;
  if(st==='denied'){try{await C.perms.manage();S.gmailPerm=await C.perms.state('mcp:'+GM).catch(()=>S.gmailPerm)}catch{toast('Use the Permissions menu at the top of this page to turn Gmail on.')}}
  if(S.gmailPerm==='granted'){S.gmailStatus='ok';toast('Gmail is allowed. You can send emails now.');refreshLists()}
  schedule();renderComposerIfOpen();
}
function canSend(){return !!C.mcp&&S.gmailPerm!=='denied'&&S.gmailStatus!=='missing'&&S.gmailStatus!=='reauth'}
function gmailHelp(compact){
  let title,text,btn=null;
  if(!C.mcp){title='This window can\'t reach your Gmail';text='Open Daylo from claude.ai in a web browser or in the Claude desktop app, signed in as the account that has Gmail connected. The Gmail connection doesn\'t work in previews or shared links.'}
  else if(S.gmailStatus==='missing'){title='Gmail isn\'t connected to Claude';text='In claude.ai go to Settings → Connectors, connect Gmail, then reload this page.'}
  else if(S.gmailStatus==='reauth'){title='Your Gmail connection expired';text='In claude.ai go to Settings → Connectors and reconnect Gmail, then reload this page.'}
  else if(S.gmailPerm==='denied'){title='Gmail is switched off for this app';text='Turn it back on to send from here.';btn=h('button',{class:'btn sm primary',type:'button',onclick:allowGmail},'Turn Gmail on')}
  else if(S.gmailPerm!=='granted'&&S.gmailStatus!=='ok'){title='Allow Gmail once';text='Claude asks one time before this app can read and send your email.';btn=h('button',{class:'btn sm primary',type:'button',onclick:allowGmail},icon('mail'),'Allow Gmail')}
  else return null;
  return h('div',{class:'notice'+(btn?' info':'')},icon(btn?'mail':'alert'),h('div',{class:'grow'},h('p',null,h('b',null,title)),compact?null:h('p',null,text),btn?h('div',{style:'margin-top:8px'},btn):null));
}
function renderComposerIfOpen(){if(CP&&CP.step!=='sending'){if(CP.step==='edit')syncFields();drawComposer()}}
async function gm(tool,input,opts){if(!C.mcp)throw{code:'no_mcp'};const r=await C.mcp.callTool(GM,tool,input,opts);return r&&r.payload!==undefined?r.payload:r}
function inboxQuery(){const t=S.inboxTab;if(t==='search')return S.inboxQ||'in:inbox';if(t==='primary')return 'in:inbox category:primary';if(t==='all')return 'in:inbox';return S.settings.dealQuery||DEAL_Q}
const DENY=['needs_reauth','server_not_connected','blocked_by_policy','approval_required','not_in_manifest','selection_required','no_mcp','not_granted','capability_disabled'];
function watchList(slot,query){
  const L=S.lists[slot];
  if(!C.mcp){L.error={code:'no_mcp'};L.loading=false;return}
  if(L.key===query&&L.unsub)return;
  L.unsub&&L.unsub();L.key=query;L.threads=[];L.loading=true;L.error=null;
  const input={query,pageSize:30};
  L.input=input;
  L.unsub=C.mcp.watchTool(GM,'search_threads',input,ev=>{
    if(L.key!==query)return;L.loading=false;
    if(ev.type==='data'){const p=ev.result.payload||{};L.threads=Array.isArray(p.threads)?p.threads:[];L.at=ev.result.cache?.storedAt||Date.now();L.error=null;S.gmailStatus='ok';S.gmailPerm='granted'}
    else{const c=ev.error?.code;if(DENY.includes(c))L.threads=[];L.error=ev.error;if(c==='needs_reauth')S.gmailStatus='reauth';if(c==='server_not_connected')S.gmailStatus='missing'}
    schedule();
  },{cache:{staleTime:60000},refetchInterval:180000});
}
async function loadListOnce(slot){
  const L=S.lists[slot];L.loading=true;L.error=null;schedule();
  try{const p=await gm('search_threads',L.input||{query:L.key,pageSize:30},{cache:{staleTime:60000}});L.threads=Array.isArray(p?.threads)?p.threads:[];L.at=Date.now();S.gmailStatus='ok'}
  catch(e){L.error=e}
  L.loading=false;schedule();
}
async function refreshLists(){if(!C.mcp)return;try{await C.mcp.invalidate(GM,'search_threads')}catch{}for(const k of Object.keys(S.lists)){if(S.lists[k].error)loadListOnce(k)}}

  S.thread={id,data:null,loading:true,error:null};schedule();

  catch(e){if(S.thread.id!==id)return;S.thread.error=e}
  S.thread.loading=false;schedule();
}
function msgBody(m){return String(m.plaintextBody??m.plaintext_body??m.plainTextBody??m.body??decode(m.snippet)??'').replace(/\r/g,'').replace(/\n{3,}/g,'\n\n').trim()}
function threadText(t,limit=12000){
  const ms=(t?.messages||[]);let out=ms.map(m=>'From: '+(m.sender||'')+'\nDate: '+(m.date||'')+'\nSubject: '+(m.subject||'')+'\n\n'+msgBody(m).slice(0,4000)).join('\n\n-----\n\n');
  return out.length>limit?out.slice(out.length-limit):out;
}
function lastMsg(t){const ms=t?.messages||[];return ms[ms.length-1]}

/* ---------- render loop ---------- */
let queued=false,pending=false;

/* ---------- AI: campaign from email ---------- */
async function extractCampaign(t){
  const ms=t?.messages||[];const first=parseAddr(ms[0]?.sender);const tid=S.thread.id||t.id;
  const fallback={brand:'',campaign:decode(threadSubject(t)).slice(0,80),contactEmail:isNoReply(first.email)?'':first.email,stage:'Lead',currency:defCur(),payStatus:'Not invoiced',threadId:tid};
  if(!C.sample){openCampaign(fallback,{aiNote:'Fill in the details from the email, then save.'});return}
  const body=h('div',{class:'empty'},h('span',{class:'spin'}),h('b',null,'Reading the email…'),h('p',null,'Claude is pulling out the brand, deliverables, dates and any fee. You\'ll check everything before it\'s saved.'));
  openDrawer('Make campaign',body,null,{noFocus:true});
  const prompt='You help a content creator track brand deals. Read the email thread below and return ONLY a JSON object with exactly these keys:\n'+
   '{"brand":string,"campaign":string,"contactEmail":string,"feeProposed":number|null,"currency":string,"deliverables":string,"dueDate":string,"postingDate":string,"paymentTerms":string,"usageRights":string,"stage":string,"notes":string}\n'+
   'Rules: Use "" for anything the emails do not state. feeProposed is a number ONLY if a specific amount is explicitly offered for this collaboration, otherwise null; never guess or estimate. currency is a 3-letter ISO code or "". Dates are YYYY-MM-DD or "" (today is '+ymd()+'). contactEmail is the brand-side person\'s address. stage is one of: '+STAGES.join(', ')+' (pick the best fit; use "Lead" if unsure). notes is one short sentence on what the brand wants and what is still open.\n\nTHREAD:\n'+threadText(t,14000);
  let r;
  try{r=await C.sample.json(prompt,{modelTier:'default'})}
  catch(e){if(e?.code==='not_granted'||e?.code==='sampling_disabled')S.aiOk=false;closeDrawer();openCampaign(fallback,{aiNote:aiErr(e)+' Fill in the details from the email instead.'});return}
  if(!r||typeof r!=='object')r={};
  const str=v=>typeof v==='string'?v.trim():'';const date=v=>/^\d{4}-\d{2}-\d{2}$/.test(str(v))?str(v):'';
  const cur=str(r.currency).toUpperCase();
  const rec={...fallback,brand:str(r.brand),campaign:str(r.campaign)||fallback.campaign,contactEmail:validEmail(str(r.contactEmail))?str(r.contactEmail).toLowerCase():fallback.contactEmail,
    feeProposed:typeof r.feeProposed==='number'&&isFinite(r.feeProposed)?r.feeProposed:null,feeConfirmed:null,currency:CURRENCIES.includes(cur)?cur:defCur(),
    deliverables:str(r.deliverables),dueDate:date(r.dueDate),postingDate:date(r.postingDate),paymentTerms:str(r.paymentTerms),usageRights:str(r.usageRights),stage:STAGES.includes(str(r.stage))?str(r.stage):'Lead',notes:str(r.notes)};
  closeDrawer();
  openCampaign(rec,{aiNote:'Claude filled these in from the email. Check every field before saving. Any fee stays "proposed" until you confirm it.'});
}

    to:toAddr,cc:'',subject:reply?('Re: '+decode(threadSubject(o.thread)).replace(/^re:\s*/i,'')):(o.subject||''),
    body:o.body!=null?o.body:(sig?'\n\n'+sig:''),campaign:o.campaign||(reply?S.campaigns.find(c=>c.threadId===(o.thread.id||S.thread.id)):null)||null,invoice:o.invoice||null,

async function runAI(instruction){
  if(!CP||!C.sample||CP.ai.busy)return;syncFields();
  const ctl=new AbortController();CP.ai={busy:true,ctl,err:null};CP.sugg={text:'',subject:'',instruction};drawComposer();
  const c=CP.campaign;
  const ctx=[];
  if(c)ctx.push('CAMPAIGN DETAILS (only facts you may use):\nBrand: '+(c.brand||'')+'\nDeal type so far: '+dealType(c)+'\nCampaign: '+(c.campaign||'')+'\nDeliverables: '+(c.deliverables||'not set')+'\nContent due: '+(c.dueDate||'not set')+'\nPosting date: '+(c.postingDate||'not set')+'\nConfirmed fee: '+(c.feeConfirmed!=null&&c.feeConfirmed!==''?money(c.feeConfirmed,c.currency):'NOT CONFIRMED')+'\nFee the brand proposed: '+(c.feeProposed!=null&&c.feeProposed!==''?money(c.feeProposed,c.currency):'none stated')+'\nPayment terms: '+(c.paymentTerms||'not set')+'\nUsage rights: '+(c.usageRights||'not set'));
  if(S.settings.rates)ctx.push('MY RATES (quote exactly, never change the numbers):\n'+S.settings.rates);
  if(CP.invoice)ctx.push('INVOICE: '+CP.invoice.number+', '+money(CP.invoice.amount,CP.invoice.currency)+', due '+(CP.invoice.due||'')+', status '+CP.invoice.status);
  if(CP.thread)ctx.push('EMAIL THREAD (oldest first):\n'+threadText(CP.thread,10000));
  const draft=CP.body.replace((S.settings.signature||'\u0000'),'').trim();
  const prompt='You write emails for '+(myName()||'a content creator')+', a content creator managing brand partnerships. Write in first person as them.\n'+
    'Style: plain text only, no markdown, no emoji unless the thread uses them. Warm, confident, professional, concise. Match the language the brand writes in (default English).\n'+
    'Never invent fees, numbers, dates, follower counts, links or facts that are not given below. If one is needed and unknown, write a clear placeholder in square brackets, e.g. [your rate].\n'+
    (CP.mode==='reply'?'Write ONLY the reply body. No subject line. Do not quote the earlier emails.\n':'First line must be "Subject: <subject>", then a blank line, then the body.\n')+
    'End with this sign-off exactly:\n'+(S.settings.signature||myName()||'[your name]')+'\n\n'+
    (ctx.length?ctx.join('\n\n')+'\n\n':'')+
    (CP.mode==='new'&&CP.to?'RECIPIENT: '+CP.to+'\n':'')+
    (draft?'CURRENT DRAFT (rewrite or improve it according to the request):\n'+draft+'\n\n':'')+
    'REQUEST: '+instruction;
  const split=t=>{let subject='',body=t;if(CP.mode==='new'){const m=t.match(/^Subject:\s*(.+)\n?/i);if(m){subject=m[1].trim();body=t.slice(m[0].length).replace(/^\n+/,'')}}return{subject,body:body.trim()}};
  try{
    const res=await C.sample(prompt,{signal:ctl.signal,cache:false,onText:({text})=>{const el=$('#ai-sugg');if(el)el.textContent=split(text).body}});
    const sp=split(res.text);if(CP&&CP.sugg){CP.sugg.text=sp.body;CP.sugg.subject=sp.subject}
    if(CP)CP.ai={busy:false,ctl:null,err:res.truncated?'The suggestion was cut short. Ask for something shorter.':null};
  }catch(e){
    if(CP&&CP.sugg){if(e?.text&&e.code!=='refused'){const sp=split(e.text);CP.sugg.text=sp.body;CP.sugg.subject=sp.subject}else CP.sugg=null}
    if(['not_granted','sampling_disabled','not_declared'].includes(e?.code))S.aiOk=false;
    if(CP)CP.ai={busy:false,ctl:null,err:aiErr(e)};
  }
  if(CP)drawComposer();
}
function reviewWarnings(){
  const w=[];const to=emails(CP.to),cc=emails(CP.cc);
  if(!to.length)w.push(['bad','Add at least one recipient.']);
  [...to,...cc].filter(e=>!validEmail(e)).forEach(e=>w.push(['bad','"'+e+'" doesn\'t look like an email address.']));
  if(CP.mode==='new'&&!CP.subject.trim())w.push(['warn','The subject is empty.']);
  if(!CP.body.trim())w.push(['bad','The message is empty.']);
  const ph=CP.body.match(/\[[^\]\n]{1,40}\]/g);if(ph)w.push(['warn','Fill in the placeholders: '+[...new Set(ph)].join(', ')]);
  if(/\{\{|\}\}/.test(CP.body))w.push(['warn','The message contains template brackets {{ }}.']);
  const amounts=CP.body.match(/[€$£]\s?\d[\d,.]*|\d[\d,.]*\s?(?:EUR|USD|GBP|CZK|Kč|PLN|CHF)/gi);
  if(amounts&&!CP.upgradeFor&&CP.campaign&&(CP.campaign.feeConfirmed==null||CP.campaign.feeConfirmed===''))w.push(['warn','This email mentions an amount ('+amounts[0]+') but the campaign fee isn\'t confirmed yet.']);
  return w;
}

  const rec={to:emails(snap?.to??''),cc:emails(snap?.cc??''),subject:snap?.subject||'',body:snap?.body||'',mode:snap?.mode,sentAt:r.at,messageId:r.id,threadId:r.threadId,verified:ok,campaignId:snap?.campaign?.id||null,invoiceId:snap?.invoice?.id||null};

  if(CP===snap)drawComposer();

/* ---------- phone notifications and the app icon badge ---------- */
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function notifSupported(){return 'Notification' in window&&'serviceWorker' in navigator}
function notifState(){return notifSupported()?Notification.permission:'unsupported'}
async function swReg(){if(!('serviceWorker' in navigator))return null;try{return await Promise.race([navigator.serviceWorker.ready,new Promise(r=>setTimeout(()=>r(null),3000))])}catch{return null}}
async function showNote(title,body,tag,url){const r=await swReg();const o={body,tag,icon:'icons/icon-192.png',badge:'icons/icon-192.png',data:{url:url||'./#today'}};
  if(r&&r.showNotification){try{return await r.showNotification(title,o)}catch{}}try{new Notification(title,o)}catch{}}
function updateBadge(){if(!CUR)return;const n=notifications().filter(x=>x.lvl).length;try{if(navigator.setAppBadge){n?navigator.setAppBadge(n):navigator.clearAppBadge()}}catch{}}
async function enableNotifs(){
  if(!notifSupported()||(isIOS&&!isStandalone())){toast(isIOS?'On iPhone: open Daylo in Safari, tap Share → “Add to Home Screen”, then open Daylo from your Home Screen and turn notifications on there.':'This browser can’t show notifications. Try Chrome or Safari.');return}
  let r='default';try{r=await Notification.requestPermission()}catch{}
  if(r==='granted'){await saveSettings({notifOn:true});registerPeriodic();await showNote('Notifications are on','Daylo will remind you about what’s due, what’s late and what’s coming up.','daylo-on','./#today');toast('Notifications are on');setTimeout(()=>notifyNow(),1500)}
  else toast('Notifications stay off. You can turn them on later in your phone’s settings.');
  schedule()}
async function registerPeriodic(){try{const r=await swReg();if(r&&'periodicSync' in r){let ok=true;try{const st=await navigator.permissions.query({name:'periodic-background-sync'});ok=st.state==='granted'}catch{}if(ok)await r.periodicSync.register('daylo-check',{minInterval:4*60*60*1000})}}catch{}}
let notifBusy=false;
async function notifyNow(){if(notifBusy||!CUR||notifState()!=='granted'||!S.settings.notifOn)return;notifBusy=true;
  try{const t=ymd(),now=new Date();let changed=false;
    const sent=(S.settings.notified&&S.settings.notified.day===t)?{...S.settings.notified,keys:[...S.settings.notified.keys]}:{day:t,keys:[]};
    let last=null;try{last=await IDB.get('lastSummary:'+CUR)}catch{}
    if(last!==t&&now.getHours()>=7){const late=S.tasks.filter(x=>!x.done&&x.due&&x.due<t).length,due=S.tasks.filter(x=>!x.done&&x.due===t).length,rt=routinesOn(t).filter(r=>!routineDone(r,t)).length;
      if(late||due||rt){await showNote('Your day',[due&&due+' due today',late&&late+' late',rt&&rt+(rt===1?' routine':' routines')].filter(Boolean).join(' · '),'daylo-summary','./#schedule')}
      try{await IDB.set('lastSummary:'+CUR,t)}catch{}}
    for(const x of S.tasks.filter(x=>!x.done&&x.due===t&&x.time)){const[hh,mm]=x.time.split(':').map(Number);const at=new Date();at.setHours(hh,mm,0,0);const diff=(at-now)/60000;const k='soon:'+x.id+':'+x.time;
      if(diff<=15&&diff>-5&&!sent.keys.includes(k)){await showNote(diff>0?'In '+Math.max(1,Math.round(diff))+' min: '+x.title:'Now: '+x.title,(x.type||'Task')+(x.campaignId?' · '+campaignName(x.campaignId):''),k,'./#schedule');sent.keys.push(k);changed=true}}
    for(const i of S.invoices.filter(i=>i.status==='Sent'&&i.due&&i.due<t)){const k='inv:'+i.id;if(!sent.keys.includes(k)){await showNote('Payment is late',(i.client||'An invoice')+' · '+money(i.amount,i.currency),k,'./#payments');sent.keys.push(k);changed=true}}
    if(changed){S.settings={...S.settings,notified:sent};persist()}
  }finally{notifBusy=false}}
setInterval(()=>{notifyNow();updateBadge()},60000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){notifyNow();updateBadge()}});
function notifSetup(){const st=notifState();const on=st==='granted'&&S.settings.notifOn;
  if(on)return h('div',{class:'nset'},icon('bell'),h('div',{class:'grow'},h('b',null,'Phone notifications are on'),h('p',null,'A summary each morning, a heads-up 15 minutes before timed tasks, and late payments. The app icon shows how many things need you.')),h('button',{class:'btn sm ghost',onclick:async()=>{await saveSettings({notifOn:false});try{navigator.clearAppBadge&&navigator.clearAppBadge()}catch{}toast('Notifications paused');closeDrawer()}},'Pause'));
  if(st==='denied')return h('div',{class:'nset'},icon('bell'),h('div',{class:'grow'},h('b',null,'Notifications are blocked'),h('p',null,'Turn them on for this site in your phone or browser settings, then come back.')));
  const ios=isIOS&&!isStandalone();
  return h('div',{class:'nset'},icon('bell'),h('div',{class:'grow'},h('b',null,'Get reminders on your phone'),h('p',null,ios?'On iPhone, first add Daylo to your Home Screen (Share → Add to Home Screen), then open it from there.':'Your phone asks you first. You can turn them off anytime.')),ios?null:h('button',{class:'btn sm primary',onclick:enableNotifs},'Turn on'));
}

const GOOGLE_CLIENT_ID='696829738580-90g050if0p3qkklt6rsvql7c0a7fj20k.apps.googleusercontent.com';   // filled in after the Google Cloud setup
const GSCOPE='https://www.googleapis.com/auth/gmail.readonly https://www.googleapis.com/auth/gmail.send https://www.googleapis.com/auth/calendar.readonly';
let GCALOK=false;
let GSEND=false;
let GTOK=null,GTOKexp=0,gisP=null;
const GMS={busy:false};
function gmailReady(){return !!GOOGLE_CLIENT_ID}
function loadGis(){if(gisP)return gisP;gisP=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.onload=()=>res();s.onerror=()=>{gisP=null;rej(new Error('gis'))};document.head.append(s)});return gisP}

/* Google sign-in on the same screen (no pop-up): go to Google, come back with a pass */
const GKEY='daylo-gpass';
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch{return null}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch{}}
(function grabPass(){
  const hs=location.hash||'';if(!/access_token=|error=/.test(hs))return;
  const q=new URLSearchParams(hs.slice(1));const want=lsGet('daylo-gstate');
  try{history.replaceState(null,'',location.pathname)}catch{}
  if(q.get('error')){GMS.backErr=q.get('error')==='access_denied'?'Gmail wasn’t allowed, so nothing was read.':'Google didn’t allow it this time. Try again.';return}
  if(!want||q.get('state')!==want.state){return}
  GSEND=/gmail\.send/.test(q.get('scope')||'');GCALOK=/calendar/.test(q.get('scope')||'');
  if(!/gmail\.readonly/.test(q.get('scope')||'')){GMS.backErr='Please tick the box that lets Daylo read your email, then try again.';return}
  GTOK=q.get('access_token');GTOKexp=Date.now()+(Number(q.get('expires_in'))||3600)*1000;
  lsSet(GKEY,{t:GTOK,exp:GTOKexp,send:GSEND,cal:GCALOK});GMS.autoFor=want.cur||'';lsSet('daylo-gstate',null);
})();
(function restorePass(){if(GTOK)return;const p=lsGet(GKEY);if(p&&p.t&&Date.now()<p.exp-60000){GTOK=p.t;GTOKexp=p.exp;GSEND=!!p.send;GCALOK=!!p.cal}})();
function gToken(){
  if(GTOK&&Date.now()<GTOKexp-60000)return Promise.resolve(GTOK);
  if(!gmailReady())return Promise.reject({copy:'Gmail is almost ready. Try again soon.'});
  const state=Math.random().toString(36).slice(2)+Date.now().toString(36);
  lsSet('daylo-gstate',{state,cur:(typeof CUR==='string'?CUR:''),at:Date.now()});
  const u=new URL('https://accounts.google.com/o/oauth2/v2/auth');
  const ps={client_id:GOOGLE_CLIENT_ID,redirect_uri:location.origin+'/',response_type:'token',scope:GSCOPE,include_granted_scopes:'true',state};
  const hint=hintEmail();if(hint)ps.login_hint=hint;
  Object.entries(ps).forEach(([k,v])=>u.searchParams.set(k,v));
  location.href=u.toString();
  return new Promise(()=>{});
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function gget(path,params,tries){tries=tries||0;
  const u=new URL('https://gmail.googleapis.com/gmail/v1/users/me/'+path);
  if(params)Object.entries(params).forEach(([k,v])=>[].concat(v).forEach(x=>u.searchParams.append(k,x)));
  let r;try{r=await fetch(u,{headers:{Authorization:'Bearer '+GTOK}})}catch{throw {copy:'Gmail didn’t answer. Check your connection and try again.'}}
  if(r.status===401){GTOK=null;lsSet(GKEY,null);throw {copy:'Your Google sign-in expired. Tap “Check Gmail” again.',expired:true}}
  if(r.status===429||r.status===403){let j={};try{j=await r.clone().json()}catch{}
    const why=((j.error&&j.error.errors&&j.error.errors[0]&&j.error.errors[0].reason)||'')+' '+((j.error&&j.error.message)||'');
    if(/rateLimit|quota|userRateLimit|Quota exceeded/i.test(why)||r.status===429){if(tries<4){GMS.wait&&GMS.wait();await sleep(15000*(tries+1));return gget(path,params,tries+1)}throw {copy:'Gmail is busy right now. Wait a minute and tap Check Gmail again.',stop:true}}
    if(/insufficient|scope/i.test(why)){GTOK=null;throw {copy:'Daylo needs permission to read your email. Tap Connect Gmail again and tick the Gmail box.',stop:true,expired:true}}
    if(/has not been used|disabled/i.test(why))throw {copy:'Gmail is still switching on at Google. Try again in a few minutes.',stop:true};
    throw {copy:r.status===429?'Gmail asked us to slow down. Try again in a minute.':'Google didn’t allow reading this inbox yet. While Daylo is in testing, your email has to be on the tester list.',stop:true}}
  if(!r.ok)throw {copy:'Gmail didn’t answer. Try again.'};
  return r.json();
}

/* reading one email */
function b64u(s){try{const bin=atob((s||'').replace(/-/g,'+').replace(/_/g,'/'));return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)))}catch{return ''}}
function htmlText(x){return x.replace(/<(style|script)[\s\S]*?<\/\1>/gi,' ').replace(/<br\s*\/?>|<\/p>|<\/div>|<\/tr>/gi,'\n').replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&#39;|&rsquo;/g,'’').replace(/&quot;/g,'"').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&#\d+;/g,' ')}
function bodyOf(p){
  let plain='',html='';
  (function walk(x){if(!x)return;const mt=x.mimeType||'';
    if(mt==='text/plain'&&x.body&&x.body.data&&!plain)plain=b64u(x.body.data);
    else if(mt==='text/html'&&x.body&&x.body.data&&!html)html=b64u(x.body.data);
    (x.parts||[]).forEach(walk)})(p);
  let t=plain||htmlText(html);
  const cut=t.search(/\n\s*On .{5,120}wrote:|\n-{2,}\s*Original Message|\n\s*From: .+\n\s*Sent: /i);if(cut>0)t=t.slice(0,cut);
  return t.split('\n').filter(l=>!/^\s*>/.test(l)).join('\n').replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim().slice(0,5000);
}
function hdr(m,n){const x=(m.payload&&m.payload.headers||[]).find(y=>y.name.toLowerCase()===n.toLowerCase());return x?x.value:''}
function parseMsg(m){
  if(!m||!m.payload)return null;
  const from=parseAddr(hdr(m,'From'));
  return {id:m.id,threadId:m.threadId,from,fromName:from.name||from.email,subject:hdr(m,'Subject')||'(no subject)',
    at:Number(m.internalDate)||Date.parse(hdr(m,'Date'))||Date.now(),snippet:htmlText(m.snippet||'').slice(0,180),
    bulk:!!hdr(m,'List-Unsubscribe')||/bulk|list/i.test(hdr(m,'Precedence'))||isNoReply(from.email||''),
    mine:(m.labelIds||[]).includes('SENT'),unread:(m.labelIds||[]).includes('UNREAD'),text:bodyOf(m.payload)};
}

const XCOLLAB=/(^|\s)[x×](\s|$)/i;   // "Brand x @creator" style subjects
const MONTHS=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
const WDAYS=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
function findAmount(t){
  const m=t.match(/([$€£])\s?(\d{1,3}(?:[,.]\d{3})+|\d+)(?:\.(\d{2}))?\s?(k\b)?|(\d{1,3}(?:,\d{3})+|\d+)(?:\.(\d{2}))?\s?(USD|EUR|GBP)\b/i);
  if(!m)return null;
  if(m[1]){let n=Number(m[2].replace(/[,.]/g,''))+(m[3]?Number(m[3])/100:0);if(m[4])n*=1000;if(!n||n>1e6)return null;return {n,cur:{'$':'USD','€':'EUR','£':'GBP'}[m[1]]}}
  const n=Number(m[5].replace(/,/g,''))+(m[6]?Number(m[6])/100:0);if(!n||n>1e6)return null;return {n,cur:m[7].toUpperCase()}
}
function findDate(t,sentAt){
  const now=new Date();now.setHours(0,0,0,0);const base=new Date(sentAt||Date.now());base.setHours(0,0,0,0);
  const ok=d=>{if(!d||isNaN(d))return null;const diff=(d-now)/864e5;return diff>=-1&&diff<=150?ymd(d):null};
  const lc=t.toLowerCase();let m;
  const mon='(jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:t(?:ember)?)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)';
  const fix=(mo,da)=>{let d=new Date(base.getFullYear(),mo,da);if(d<base&&(base-d)/864e5>60)d=new Date(base.getFullYear()+1,mo,da);return d};
  if((m=lc.match(new RegExp('\\b'+mon+'\\.?\\s+(\\d{1,2})(?:st|nd|rd|th)?\\b'))))return ok(fix(MONTHS.indexOf(m[1].slice(0,3)),Number(m[2])));
  if((m=lc.match(new RegExp('\\b(\\d{1,2})(?:st|nd|rd|th)?\\s+(?:of\\s+)?'+mon+'\\b'))))return ok(fix(MONTHS.indexOf(m[2].slice(0,3)),Number(m[1])));
  if((m=lc.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/))&&Number(m[1])<=12&&Number(m[2])<=31)return ok(fix(Number(m[1])-1,Number(m[2])));
  if(/\btomorrow\b/.test(lc)){const d=new Date(base);d.setDate(d.getDate()+1);return ok(d)}
  if(/\btoday\b|\btonight\b/.test(lc))return ok(new Date(base));
  if((m=lc.match(/\b(?:this|next|on)\s+(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/))){const w=WDAYS.indexOf(m[1]);const d=new Date(base);let add=(w-d.getDay()+7)%7||7;d.setDate(d.getDate()+add);return ok(d)}
  return null;
}
function payer(t){const m=t.match(/\bfrom\s+([A-Z][\w&.'’-]*(?:\s+[A-Z][\w&.'’-]*){0,3})/);return m?m[1].replace(/[.]$/,''):''}
function m0(a){if(!a)return '';try{return new Intl.NumberFormat(undefined,{style:'currency',currency:a.cur,maximumFractionDigits:a.n%1?2:0,minimumFractionDigits:a.n%1?2:0}).format(a.n)}catch{return a.n+' '+a.cur}}
function guessBrand(from){
  const dom=((from.email||'').split('@')[1]||'').toLowerCase();

function organize(msgs){

    const add=(kind,extra)=>{const key=kind+':'+tid;if(skip.has(key)||have.has(tid))return;out.push({...base,kind,key,...extra})};

    else if(MK.owed.test(text)&&(isDeal||amt))kind='owed';

  panel.replaceWith(h('div',{class:'form'},h('p',null,h('b',null,ms.length+' thing'+(ms.length===1?'':'s')+' to fix')),...rows,

const _handleSaid=handleSaid;
handleSaid=function(raw){
  const n=raw.toLowerCase().replace(/[.!?]+$/,'').replace(/^(hey |ok |okay |hello |hi )?(daylo,?\s*)?(can you |could you |please )*/,'').trim();
  const m=n.match(/^(?:open|show|find|read|look for|search)(?: me)?(?: the| my)?(?: last| latest| new)?\s+(?:emails?|mails?|messages?|conversation)?\s*(?:from|with|of|about|by|for)?\s+(.+)$/);
  if(m&&!/^(deals?|payments?|settings|today|schedule|calendar|contacts|inbox|my email|email)$/.test(m[1].trim())){
    const q=m[1].split(/,| that | which | who | the company| we are| we're/)[0].replace(/\b(company|brand|collection's)\b/g,'').trim();
    stopListening();return findAndOpen(q,raw);
  }

    let j;try{const r=await fetch('https://api.languagetool.org/v2/check',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({text,language:'auto',preferredVariants:'en-US',level:'picky'})});j=await r.json()}catch{box.classList.remove('busy');return}
    if(seq!==LV.seq||ta.value!==text)return;box.classList.remove('busy');
    const ms=(j.matches||[]).filter(m=>m.replacements&&m.replacements.length).slice(0,8);
    if(!ms.length){box.replaceChildren(h('span',{class:'ls-ok'},icon('check'),'Reads well'));return}
    const apply=(m)=>{const cur=ta.value;const bad=text.substr(m.offset,m.length);if(cur.substr(m.offset,m.length)!==bad){liveCheck(ta,box);return}ta.value=cur.slice(0,m.offset)+m.replacements[0].value+cur.slice(m.offset+m.length);if(CP)CP.body=ta.value;liveCheck(ta,box)};
    box.replaceChildren(h('span',{class:'ls-h'},'Suggestions'),
      ...ms.map(m=>h('button',{type:'button',class:'ls-chip',title:m.message,onclick:()=>apply(m)},h('s',null,text.substr(m.offset,m.length)||'·'),' → ',h('b',null,m.replacements[0].value||'(remove)'))),
      ms.length>1?h('button',{type:'button',class:'ls-all',onclick:()=>{let v=ta.value;[...ms].sort((a,b)=>b.offset-a.offset).forEach(m=>{if(v.substr(m.offset,m.length)===text.substr(m.offset,m.length))v=v.slice(0,m.offset)+m.replacements[0].value+v.slice(m.offset+m.length)});ta.value=v;if(CP)CP.body=v;liveCheck(ta,box)}},'Fix all'):null);
  },1200);
}

/* ---------- saved companies and numbered invoices ---------- */
const _saveS=save;
async function ensureContact(name,email,brand){
  email=String(email||'').trim().toLowerCase();if(!validEmail(email)||isNoReply(email)||/@([a-z0-9-]+\.)*(paypal|stripe|venmo|wise|zelle|squareup|square|intuit|quickbooks|payoneer|cash\.app|revolut|bill\.com)\./i.test(email))return;
  if(S.contacts.some(c=>(c.email||'').toLowerCase()===email))return;
  await _saveS('contacts',{name:name||brand||email.split('@')[0],email,brand:brand||name||'',type:'Brand',fromDaylo:true});
}
save=async function(coll,obj){
  const id=await _saveS(coll,obj);
  try{if(coll==='campaigns')await ensureContact(obj.brand,obj.contactEmail,obj.brand);if(coll==='invoices')await ensureContact(obj.client,obj.clientEmail,obj.client)}catch(e){console.error(e)}
  return id;
};
/* money found in email gets a numbered invoice record, so Payments is never empty */
const _trackMoneyS=trackMoney;
trackMoney=async function(x,quiet){
  const cid=await _trackMoneyS(x,true);
  try{if((x.kind==='paid'||x.kind==='owed')&&x.amount&&!S.invoices.some(i=>i.campaignId===cid||(i.gmailThread&&i.gmailThread===x.threadId))){
    const c=S.campaigns.find(c=>c.id===cid)||{};const day=ymd(new Date(x.at||Date.now()));
    await save('invoices',{number:nextInvoiceNumber(),status:x.kind==='paid'?'Paid':'Sent',issued:day,due:x.kind==='paid'?day:addDays(day,30),paidOn:x.kind==='paid'?day:'',client:x.brand,clientEmail:c.contactEmail||'',description:x.subject||c.campaign||'',amount:x.amount.n,currency:x.amount.cur,campaignId:cid,gmailThread:x.threadId,notes:'Made from your email'})}}catch(e){console.error(e)}
  if(!quiet){toast(x.brand+' added');renderMain()}
  return cid;
};

const HL={
 late:[['{late} thing{s} running late.','Fashionably, of course.'],['Something’s late.','We won’t tell. Today.'],['{late} late.','Deadlines are a vibe, right?']],
 money:[['{sum} is on its way.','Act surprised.'],['Someone owes you {sum}.','Not that we’re counting.'],['{sum} waiting for you.','Patience looks good on you.'],['{sum} pending.','Manifesting faster payments.']],

 busy:[['A busy {day}.','You’ve got this. Mostly.'],['{todo} things today.','Hydrate between them.'],['Full day ahead.','Main-character schedule.'],['{todo} to do.','Pace yourself, icon.']],
 free:[['Nothing due today.','Suspicious.'],['Empty schedule.','Enjoy it before brands find out.'],['A free {day}.','Plan something. Or don’t.'],['Zero tasks.','Is this what peace feels like?']],
 deliver:[['{deliver} deal{s2} to deliver.','The content won’t shoot itself.'],['Brands are waiting.','In the nicest way.']],
 mon:[['Monday.','Let’s pretend we’re ready.'],['New week.','Same iconic you.']],
 fri:[['Friday.','The inbox can wait. Probably.'],['It’s Friday.','Reply now, rest later.']],
 wknd:[['Weekend mode.','Mostly.'],['It’s the weekend.','Only the good emails.']],

function dailyHeadline(d){
  const pool=[];const add=k=>HL[k].forEach(x=>pool.push(x));
  if(d.late)add('late');if(d.sumTxt)add('money');if(d.mail>=8)add('mails');
  if(d.todo>=4)add('busy');if(!d.todo)add('free');if(d.deliver)add('deliver');
  const wd=new Date().getDay();if(wd===1)add('mon');if(wd===5)add('fri');if(wd===0||wd===6)add('wknd');
  if(pool.length<3)add('any');
  const seed=ymd().split('-').reduce((a,b)=>a*31+Number(b),7)+(S.hlBump||0);
  const pick=pool[Math.abs(seed)%pool.length];
  const fill=s=>s.replace(/\{(\w+)\}/g,(_,k)=>k==='s'?(d.late===1?'':'s'):k==='s2'?(d.deliver===1?'':'s'):k==='sum'?d.sumTxt:k==='day'?d.dayName:String(d[k]));
  return [fill(pick[0]),fill(pick[1])];
}

/* 2) Inbox: the last 30 days, Superhuman-style rows (bold name, one short line) */
const IBX={busy:false};
async function loadInbox30(force){
  if(IBX.busy)return;if(!tokOk()){if(force)return checkInbox();return}
  if(!force&&S.settings.gmailInboxAt&&Date.now()-S.settings.gmailInboxAt<120000)return;
  IBX.busy=true;if(page==='inbox')renderMain();
  try{
    let ids=[],pt;
    for(let k=0;k<3;k++){const r=await gget('messages',Object.assign({q:'newer_than:30d in:inbox',maxResults:100},pt?{pageToken:pt}:{}));ids.push(...(r.messages||[]));pt=r.nextPageToken;if(!pt||ids.length>=250)break}
    const byThread=new Map();ids.forEach(m=>{if(!byThread.has(m.threadId))byThread.set(m.threadId,m.id)});
    const list=[...byThread.values()].slice(0,150);const out=[];let i=0;
    const w=async()=>{while(i<list.length){const id=list[i++];try{const m=await gget('messages/'+id,{format:'metadata',metadataHeaders:['From','Subject','Date','List-Unsubscribe','Precedence']});const p=parseMsg(m);
      if(p)out.push({threadId:p.threadId,fromName:p.fromName,email:p.from.email,subject:p.subject,snippet:p.snippet,at:p.at,unread:p.unread,bulk:p.bulk||(m.labelIds||[]).some(l=>/CATEGORY_(PROMOTIONS|SOCIAL|FORUMS|UPDATES)/.test(l))})}catch(e){if(e.expired)break}}};
    await Promise.all(Array.from({length:6},w));
    out.sort((a,b)=>b.at-a.at);
    await saveSettings({gmailInbox:out,gmailInboxAt:Date.now(),gmailAt:S.settings.gmailAt||Date.now()});
  }catch(e){toast(e.copy||'Couldn’t load your emails.')}
  finally{IBX.busy=false;if(page==='inbox')renderMain();try{renderTabbar()}catch{}}
}

function gmailInboxPanel(){
  const st=S.settings;const list=inboxList();
  if(!st.gmailAt&&!list.length)return h('section',{class:'sh-empty'},h('p',null,'Connect Gmail to see your last 30 days of email here.'),h('button',{class:'btn primary',onclick:checkGmail},icon('mail'),'Connect Gmail'));
  const now=new Date();const t0=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
  const grp=ms=>ms>=t0?'Today':ms>=t0-864e5?'Yesterday':ms>=t0-6*864e5?'This week':'Earlier';
  const when=ms=>{const d=new Date(ms);return ms>=t0?d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):ms>=t0-6*864e5?d.toLocaleDateString(undefined,{weekday:'short'}):d.toLocaleDateString(undefined,{month:'short',day:'numeric'})};

/* 4) Microphone inside the reply: speak, then it's tidied up (same words, cleaner) */
const DICT={rec:null,on:false,raw:''};
function tidySpoken(s){s=s.replace(/\s+/g,' ').trim();if(!s)return s;
  s=s.replace(/\b(um+|uh+|erm|hmm+|mm+)\b[,.]?\s*/gi,'').replace(/\s+([,.!?])/g,'$1').replace(/\bi\b/g,'I').replace(/\bi'(m|ll|ve|d)\b/g,"I'$1");

async function autoPolish(ta){

    let v=text;(j.matches||[]).filter(m=>m.replacements&&m.replacements.length&&!/TYPOGRAPHY|WHITESPACE/.test((m.rule||{}).issueType||'')).sort((a,b)=>b.offset-a.offset).forEach(m=>{v=v.slice(0,m.offset)+m.replacements[0].value+v.slice(m.offset+m.length)});
    if(ta.value===text){ta.value=v;if(CP)CP.body=v;ta.dispatchEvent(new Event('input',{bubbles:true}))}}catch{}
}
function dictate(ta,btn){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('Your phone’s browser can’t listen here. Use the microphone on your keyboard instead.');return}
  if(DICT.on){try{DICT.rec.stop()}catch{}return}
  const full=ta.value;let pos=ta.selectionStart;if(pos==null||(document.activeElement!==ta&&pos===full.length))pos=(full.match(/^\s*/)||[''])[0].length;const pre=full.slice(0,pos),post=full.slice(pos);let finalTxt='';
  const r=new SR();r.lang=S.settings.voiceLang||navigator.language||'en-US';r.continuous=true;r.interimResults=true;
  DICT.rec=r;DICT.on=true;btn.classList.add('on');btn.lastChild.textContent='Listening… tap to stop';
  const join=(a,b)=>a.trim()?a.replace(/[ \t]+$/,'')+(/\n$/.test(a)?'':' ')+b:b;const put=x=>(pre.trim()?join(pre,x):x)+(post.trim()?(/^[ \t]*\n/.test(post)?post:(pre.trim()?' '+post:'\n\n'+post.replace(/^\s+/,''))):'');
  r.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const x=e.results[i];if(x.isFinal)finalTxt+=' '+x[0].transcript;else interim+=x[0].transcript}
    ta.value=put((finalTxt+' '+interim).trim());if(CP)CP.body=ta.value};
  r.onerror=e=>{if(e.error==='not-allowed')toast('Allow the microphone for this app in your phone settings.')};
  r.onend=async()=>{DICT.on=false;btn.classList.remove('on');btn.lastChild.textContent='Speak';
    const said=tidySpoken(finalTxt);if(!said)return;
    ta.value=put(said);if(CP)CP.body=ta.value;btn.lastChild.textContent='Polishing…';
    await autoPolish(ta);btn.lastChild.textContent='Speak';
    const box=document.getElementById('live-sug');const undoTo=put(finalTxt.trim());
    if(box)box.replaceChildren(h('span',{class:'ls-ok'},icon('check'),'Polished — same words, cleaner'),h('button',{type:'button',class:'ls-all',onclick:()=>{ta.value=undoTo;if(CP)CP.body=undoTo;box.replaceChildren()}},'Undo'))};
  try{r.start()}catch{DICT.on=false;btn.classList.remove('on');btn.lastChild.textContent='Speak'}
}
